<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bills Tracker — Coming soon</title>
  <meta name="description" content="A simple way to track your bills and due dates. Coming soon.">
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #1f7a5c;
      --border: #e4e4e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --card: #1c1c1f;
        --text: #f2f2f3;
        --muted: #a0a0a8;
        --accent: #4cc39a;
        --border: #2c2c31;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      color: var(--accent);
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    .badge {
      display: inline-block;
      margin-top: 24px;
      padding: 6px 14px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="17" rx="2"/>
      <path d="M3 9h18M8 2v4M16 2v4"/>
      <path d="m9 15 2 2 4-4"/>
    </svg>
    <h1>Bills Tracker</h1>
    <p>Keep every bill and due date in one place, so nothing slips through the cracks.</p>
    <span class="badge">Coming soon</span>
  </main>
</body>
</html>
